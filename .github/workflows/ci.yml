name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: build + type-check ────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_API_URL: ""

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Backend: install + import check ─────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify imports (smoke test)
        run: |
          python -c "
          from schemas import LTVFRow, LTVFSummary, LTVFParseResult
          from excel_parser import parse_excel
          from settings import settings_router
          from result_history import results_router
          from alerting import send_alert_if_needed
          print('All imports OK')
          "

      - name: Check FastAPI app loads
        run: |
          python -c "
          import os; os.environ.setdefault('ALLOWED_ORIGINS','*')
          from main import app
          print('FastAPI app loaded OK — routes:', len(app.routes))
          "

  # ── Summary ──────────────────────────────────────────────────────────────
  all-checks:
    name: All checks passed
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Frontend build and backend import checks passed."
