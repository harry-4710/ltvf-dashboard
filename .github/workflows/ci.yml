name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: build + type-check ────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_API_URL: ""

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Backend: install + import check ─────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify imports (smoke test)
        run: |
          python -c "
          from schemas import LTVFRow, LTVFSummary, LTVFParseResult
          from excel_parser import parse_excel
          from settings import settings_router
          from result_history import results_router
          from alerting import send_alert_if_needed
          print('All imports OK')
          "

      - name: Check FastAPI app loads
        run: |
          python -c "
          import os; os.environ.setdefault('ALLOWED_ORIGINS','*')
          from main import app
          print('FastAPI app loaded OK — routes:', len(app.routes))
          "

  # ── Deploy to BTP Cloud Foundry (main branch only) ───────────────────────
  deploy:
    name: Deploy to BTP CF
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    # Only deploy on push to main (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for MBT build)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MBT (MTA Build Tool)
        run: npm install -g mbt

      - name: Install CF CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update -q
          sudo apt-get install -y cf8-cli

      - name: Install CF MTA plugin
        run: |
          curl -L "https://github.com/cloudfoundry/multiapps-cli-plugin/releases/download/v3.11.1/multiapps-plugin.linux64" \
               -o multiapps-plugin.linux64
          chmod +x multiapps-plugin.linux64
          cf install-plugin -f ./multiapps-plugin.linux64

      - name: Login to CF
        run: |
          # Method 1: Refresh token (preferred - from SSO session)
          if [ -n "${{ secrets.CF_REFRESH_TOKEN }}" ]; then
            echo "Using CF refresh token..."
            mkdir -p ~/.cf
            cat > ~/.cf/config.json << EOF
          {
            "ConfigVersion": 3,
            "Target": "${{ secrets.CF_API }}",
            "APIVersion": "3.226.0",
            "AuthorizationEndpoint": "https://login.cf.us10-003.hana.ondemand.com",
            "UAAEndpoint": "https://uaa.cf.us10-003.hana.ondemand.com",
            "UAAOAuthClient": "cf",
            "UAAOAuthClientSecret": "",
            "UAAGrantType": "",
            "AccessToken": "",
            "SSHOAuthClient": "ssh-proxy",
            "MinCLIVersion": "",
            "MinRecommendedCLIVersion": "",
            "RefreshToken": "${{ secrets.CF_REFRESH_TOKEN }}",
            "OrganizationFields": {
              "GUID": "",
              "Name": "${{ secrets.CF_ORG }}"
            },
            "SpaceFields": {
              "GUID": "",
              "Name": "${{ secrets.CF_SPACE }}"
            },
            "SSLDisabled": false,
            "AsyncTimeout": 0,
            "Trace": "",
            "ColorEnabled": "",
            "Locale": "",
            "PluginRepos": [{"Name": "CF-Community","URL": "https://plugins.cloudfoundry.org"}],
            "HTTPSProxy": "",
            "CFOnK8s": {"Enabled": false,"AuthInfo": ""}
          }
          EOF
            cf target -o "${{ secrets.CF_ORG }}" -s "${{ secrets.CF_SPACE }}"
            cf oauth-token > /dev/null && echo "✅ Authenticated via refresh token"

          # Method 2: App password fallback
          else
            echo "Using username/password..."
            cf login \
              -a "${{ secrets.CF_API }}" \
              -u "${{ secrets.CF_USER }}" \
              -p "${{ secrets.CF_PASSWORD }}" \
              -o "${{ secrets.CF_ORG }}" \
              -s "${{ secrets.CF_SPACE }}"
          fi

      - name: Build MTA archive
        run: mbt build

      - name: Deploy MTA to CF
        run: cf deploy mta_archives/ltvf-dashboard_1.0.0.mtar --version-rule ALL -f

      - name: Verify apps are running
        run: |
          cf apps
          echo ""
          echo "✅ Frontend: https://d73dca5etrial-dev-ltvf-approuter.cfapps.us10-003.hana.ondemand.com"
          echo "✅ Backend:  https://ltvf-backend.cfapps.us10-003.hana.ondemand.com/api/health"

  # ── Summary ──────────────────────────────────────────────────────────────
  all-checks:
    name: All checks passed
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Frontend build and backend import checks passed."

