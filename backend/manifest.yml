---
applications:
  - name: ltvf-backend
    memory: 1024M
    disk_quota: 2048M
    instances: 1
    buildpacks:
      - python_buildpack
    command: uvicorn main:app --host 0.0.0.0 --port $PORT
    health-check-type: http
    health-check-http-endpoint: /api/health
    services:
      - ltvf
      - ltvf-destination-svc
    env:
      ALLOWED_ORIGINS: "https://d73dca5etrial-dev-ltvf-approuter.cfapps.us10-003.hana.ondemand.com"
      USE_MOCK_SCHEDULED: "true"
      SAP_DESTINATION_NAME: "LTVF_ONPREMISE"
      SAP_ODATA_SERVICE: "/sap/opu/odata/sap/CNVLTVF3_SRV"
      ODATA_ENTITY_SET: "LTVFResultSet"
