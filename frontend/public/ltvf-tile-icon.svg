<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <rect width="56" height="56" rx="8" fill="#003366"/>
  <!-- Pass bar -->
  <rect x="8" y="22" width="10" height="24" rx="2" fill="#16a34a"/>
  <!-- Warn bar -->
  <rect x="23" y="30" width="10" height="16" rx="2" fill="#d97706"/>
  <!-- Fail bar -->
  <rect x="38" y="38" width="10" height="8" rx="2" fill="#dc2626"/>
  <!-- Baseline -->
  <line x1="6" y1="48" x2="50" y2="48" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Rate arc (top-right accent) -->
  <circle cx="43" cy="14" r="7" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="32 12" stroke-linecap="round"/>
  <text x="43" y="17.5" text-anchor="middle" font-size="6" font-family="sans-serif" font-weight="700" fill="#ffffff">%</text>
</svg>
