---
# mcp-server/manifest.yml - CF push manifest for LTVF MCP Server (HTTP+SSE mode)
# Run from INSIDE the mcp-server/ folder: cf push -f manifest.yml

applications:
  - name: ltvf-mcp-server
    path: .
    buildpack: nodejs_buildpack
    memory: 128M
    disk_quota: 256M
    instances: 1
    command: node index.js
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      MCP_TRANSPORT: http
      NODE_ENV: production
      LTVF_BACKEND_URL: https://ltvf-backend.cfapps.us10-003.hana.ondemand.com
    services:
      - ltvf-xsuaa

