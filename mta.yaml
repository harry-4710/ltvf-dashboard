_schema-version: "3.1"
ID: ltvf-dashboard
version: 1.0.0

modules:

  - name: ltvf-frontend
    type: html5
    path: frontend
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: ltvf-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
      requires:
        - name: ltvf-frontend
          artifacts:
            - dist/index.html
            - dist/assets
          target-path: dist
    requires:
      - name: ltvf-destination-svc

  - name: ltvf-backend
    type: python.cflinuxfs4
    path: backend
    parameters:
      memory: 256M
      disk-quota: 1024M
    build-parameters:
      builder: custom
      commands: []
      supported-platforms: []

resources:

  - name: ltvf-destination-svc
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
