_schema-version: "3.1"
ID: ltvf-dashboard
version: 1.0.0

modules:

  # ── Frontend build (produces dist/ artefacts for approuter) ────────────────
  - name: ltvf-frontend
    type: html5
    path: frontend
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build
      build-result: dist
      supported-platforms: []

  # ── SAP Approuter (serves static frontend + proxies /api/* to backend) ──────
  - name: ltvf-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
      requires:
        - name: ltvf-frontend
          artifacts:
            - dist/index.html
            - dist/assets
          target-path: dist
    requires:
      - name: ltvf-destination-svc

  # ── Python FastAPI backend ─────────────────────────────────────────────────
  - name: ltvf-backend
    type: python.cflinuxfs4
    path: backend
    parameters:
      memory: 256M
      disk-quota: 1024M
    build-parameters:
      builder: custom
      commands: []
      supported-platforms: []
    requires:
      - name: ltvf-destination-svc
      - name: ltvf-connectivity-svc

resources:

  # ── Destination Service (resolves named BTP destinations) ──────────────────
  - name: ltvf-destination-svc
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ── Connectivity Service (on-premise proxy for Cloud Connector) ─────────────
  - name: ltvf-connectivity-svc
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite