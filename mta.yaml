_schema-version: "3.1"
ID: ltvf-dashboard
version: 1.0.0

modules:

  - name: ltvf-frontend
    type: html5
    path: frontend
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: ltvf-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: custom
      commands:
        - npm install --production
        - cp -r ../frontend/dist ./dist
      supported-platforms: []
    requires:
      - name: ltvf-destination-svc

resources:

  - name: ltvf-destination-svc
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
